<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora — Lab GitHub</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>

  <div class="calc-wrapper">
    <div class="calc">

      <!-- VISOR -->
      <div class="calc-display">
        <div class="calc-expr" id="expression"></div>
        <div class="calc-result" id="display">0</div>
      </div>

      <!-- HISTÓRICO (feat/historico-lista) -->
      <div class="calc-history" id="history-panel">
        <ul id="history-list"></ul>
      </div>

      <!-- BOTÕES -->
      <div class="calc-buttons">

        <!-- Linha 1 — funções -->
        <button class="btn btn-fn" data-val="C">C</button>
        <button class="btn btn-fn" data-val="CE">CE</button>
        <button class="btn btn-fn" data-val="%">%</button>
        <button class="btn btn-op" data-val="/">÷</button>

        <!-- Linha 2 -->
        <button class="btn btn-num" data-val="7">7</button>
        <button class="btn btn-num" data-val="8">8</button>
        <button class="btn btn-num" data-val="9">9</button>
        <button class="btn btn-op" data-val="*">×</button>

        <!-- Linha 3 -->
        <button class="btn btn-num" data-val="4">4</button>
        <button class="btn btn-num" data-val="5">5</button>
        <button class="btn btn-num" data-val="6">6</button>
        <button class="btn btn-op" data-val="-">−</button>

        <!-- Linha 4 -->
        <button class="btn btn-num" data-val="1">1</button>
        <button class="btn btn-num" data-val="2">2</button>
        <button class="btn btn-num" data-val="3">3</button>
        <button class="btn btn-op" data-val="+">+</button>

        <!-- Linha 5 -->
        <button class="btn btn-num btn-zero" data-val="0">0</button>
        <button class="btn btn-num" data-val=".">.</button>
        <button class="btn btn-op btn-eq" data-val="=">=</button>

      </div>
    </div>
  </div>

  <script src="src/calculadora.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
